name: Update and publish hub

on:
  push:
    branches: [main]
  schedule:
    # About four times a day — picks up new GitHub Pages sites
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [project-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover live projects
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-catalog.mjs

      - name: Stage site
        run: |
          mkdir -p _site/data _site/assets
          cp index.html .nojekyll _site/
          cp assets/styles.css assets/app.js _site/assets/
          cp data/catalog.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
