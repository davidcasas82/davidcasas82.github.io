<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="color-scheme" content="dark" />
    <title>Project Hub · David Casas</title>
    <meta
      name="description"
      content="One page for every live project — open this on a TV, phone, or car browser and tap through."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316191f'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%23e4a14a' font-family='Georgia'%3EH%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <p class="kicker sans">David Casas</p>
          <h1>Project Hub</h1>
          <p class="lede">
            One link for every live project. Bookmark this page, then open whatever you need — TV, laptop, or car.
          </p>
        </div>
        <p class="meta sans">
          <a href="https://davidcasas82.github.io/">davidcasas82.github.io</a><br />
          <span id="count">Loading…</span><br />
          <span id="generated"></span>
        </p>
      </header>

      <div id="toolbar" class="toolbar" role="tablist" aria-label="Filter projects"></div>
      <main id="grid" class="grid" aria-live="polite">
        <p class="status">Loading projects…</p>
      </main>

      <footer class="sans">
        New GitHub Pages sites show up here automatically. Custom domains live in
        <code>data/extras.json</code>.
      </footer>
    </div>
    <script src="./assets/app.js"></script>
  </body>
</html>
